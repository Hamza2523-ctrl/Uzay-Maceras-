        function isHovered(btn) {
            return mouseX >= btn.x && mouseX <= btn.x + btn.width && mouseY >= btn.y && mouseY <= btn.y + btn.height;
        }

        function drawWrappedText(text, x, y, maxWidth, lineHeight, defaultColor, highlightColor) {
            let paragraphs = text.split('\n');
            let currentY = y;

            paragraphs.forEach(paragraph => {
                let words = paragraph.split(' ');
                let currentLine = '';
                let isHighlight = paragraph.includes("💡 OYUN İPUCU:");

                ctx.fillStyle = isHighlight ? highlightColor : defaultColor;
                ctx.font = isHighlight ? "bold 16px Arial" : "15px Arial";

                words.forEach((word, index) => {
                    let testLine = currentLine + word + ' ';
                    let metrics = ctx.measureText(testLine);
                    let testWidth = metrics.width;

                    if (testWidth > maxWidth && index > 0) {
                        ctx.fillText(currentLine.trim(), x, currentY);
                        currentLine = word + ' ';
                        currentY += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                });
                ctx.fillText(currentLine.trim(), x, currentY);
                currentY += lineHeight;
            });
        }

        function saveGameData() {

                playerName: playerName,

                hasPoisonBullet: hasPoisonBullet,
                isPoisonBulletEquipped: isPoisonBulletEquipped,
                stats: stats,
                titles: titles
            };
            localStorage.setItem("kaptanHamzaUzaySave", JSON.stringify(gameData));
        }

        function loadGameData() {
            const savedData = localStorage.getItem("kaptanHamzaUzaySave");
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    playerName = data.playerName || "";
                    currentLevel = data.currentLevel || 1;
                    unlockedLevel = data.unlockedLevel || 1;
                    completedUniqueLevels = data.completedUniqueLevels || [];
                    totalCoins = data.totalCoins || 0;
                    totalWins = data.totalWins || 0;
                    hasAlienWarrior = data.hasAlienWarrior || false;
                    hasDogWarrior = data.hasDogWarrior || false;
                    selectedWarrior = data.selectedWarrior || 'hamza';
                    hasBordoEffect = data.hasBordoEffect || false;
                    isBordoEffectEquipped = data.isBordoEffectEquipped || false;
                    hasOrangeEffect = data.hasOrangeEffect || false;
                    isOrangeEffectEquipped = data.isOrangeEffectEquipped || false;
                    hasDoubleShot = data.hasDoubleShot || false;
                    isDoubleShotEquipped = data.isDoubleShotEquipped || false;
                    hasPoisonBullet = data.hasPoisonBullet || false;
                    isPoisonBulletEquipped = data.isPoisonBulletEquipped || false;
                    stats = data.stats || { totalEnemiesKilled: 0, totalBulletsFired: 0 };
                    
                    if (data.titles) {
                        data.titles.forEach(savedTitle => {
                            let t = titles.find(item => item.id === savedTitle.id);
                            if (t) t.unlocked = savedTitle.unlocked;
                        });
                    }

                    if (playerName.trim() !== "") {
                        gameState = 'start';
                    }
                } catch (e) {
                    console.error("Kayıt yüklenirken hata:", e);
                }
            }
        }

        loadGameData();

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
        });

        window.addEventListener("keydown", (e) => {
            if (gameState === 'name_entry') {
                if (e.key === "Enter") {
                    if (playerName.trim() !== "") {
                        gameState = 'start';
                        saveGameData();
                    } else {
                        alert("Lütfen geçerli bir isim gir!");
                    }
                } else if (e.key === "Backspace") {
                    playerName = playerName.slice(0, -1);
                } else if (e.key.length === 1 && playerName.length < 15) {
                    playerName += e.key;
                }
                return;

                    }

                    if (gameState === 'other_modes' && isBotVsMode) {
                        isBotVsMode = false;
                        botVsState = 'select_char';
                    } else {
                        gameState = 'start';
                    }
                }
                return;
            }

            if (gameState === 'win') {
                if (e.code === "KeyS" || e.code === "KeyN") {
                    if (!isBotVsMode && currentLevel < unlockedLevel && currentLevel < 30) {
                        startPlaying(currentLevel + 1);
                    }
                } else if (e.code === "KeyR" || e.code === "Enter") {
                    if (isBotVsMode) {
                        startBotVsBattle();
                    } else {
                        startPlaying(currentLevel);
                    }
                } else if (e.code === "KeyM") {
                    goToMainMenu();
                }
                return;
            }

            if (gameState === 'gameover') {
                if (e.code === "KeyR" || e.code === "Enter") {
                    if (isBotVsMode) {
                        startBotVsBattle();
                    } else {
                        startPlaying(currentLevel);
                    }
                } else if (e.code === "KeyM") {
                    goToMainMenu();
                }
                return;
            }

            if (gameState === 'playing' && e.code === "KeyQ") {
                if (hasPoisonBullet && isPoisonBulletEquipped && poisonAmmoCount > 0 && !isPoisonActive) {
                    isPoisonActive = true;
                    poisonAmmoCount--;
                    poisonTimer = 240; 
                }
            }

            if (e.code === "Space" && !keys["Space"]) {
                shoot();
            }
            keys[e.code] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;

                return;
            }

                if (isHovered(closeUniverseMapBtn)) isUniverseMapOpen = false;

        });

        function shoot() {
            let currentColor = "#00f0ff";
            if (isBordoEffectEquipped) currentColor = "#800020";
            else if (isOrangeEffectEquipped) currentColor = "#ff7b00";

            let isPoison = false;
            if (isPoisonBulletEquipped && isPoisonActive) {
                currentColor = "#00ff66";
                isPoison = true;
                isPoisonActive = false; 
            }

            if (isDoubleShotEquipped) {
                bullets.push({ x: player.x + 20, y: player.y + 20, width: 6, height: 18, color: currentColor, isPoison: isPoison });
                bullets.push({ x: player.x + player.width - 26, y: player.y + 20, width: 6, height: 18, color: currentColor, isPoison: isPoison });
                stats.totalBulletsFired += 2;
            } else {
                bullets.push({ x: player.x + player.width / 2 - 3, y: player.y + 20, width: 6, height: 18, color: currentColor, isPoison: isPoison });
                stats.totalBulletsFired += 1;
            }
            saveGameData();
        }

            player.x = canvas.width / 2 - playerWidth / 2;
            player.y = canvas.height - playerHeight - 25;

            if (selectedWarrior === 'dog') { player.maxHp = 85; player.hp = 85; player.speed = 12; }
            else if (selectedWarrior === 'alien') { player.maxHp = 105; player.hp = 105; player.speed = 9; }
            else { player.maxHp = 100; player.hp = 100; player.speed = 9; }

            bullets = []; enemyBullets = []; apples = []; appleNotificationTimer = 0;
            poisonAmmoCount = 3; isPoisonActive = false; poisonTimer = 0;
            initEnemies(1);
        }

            if (selectedWarrior === 'dog') { player.maxHp = 85; player.hp = 85; player.speed = 12; }
            else if (selectedWarrior === 'alien') { player.maxHp = 105; player.hp = 105; player.speed = 9; }
            else { player.maxHp = 100; player.hp = 100; player.speed = 9; }

            bullets = []; enemyBullets = []; apples = []; appleNotificationTimer = 0;
            lastAppleTime = Date.now(); poisonAmmoCount = 3; isPoisonActive = false;
            poisonTimer = 0; isBossSpawned = false; isSinsiBossStage = false; sinsiTeleportTimer = 0;
            initEnemies(currentLevel);
            gameState = 'playing';
        }

        }

            enemies = [];

                enemies = [{

                }];

            }

            if (isTrainingMode) {
                enemies = [
                    { x: 150, y: 100, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: 1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" },
                    { x: 500, y: 150, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: -1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" }
                ];
                return;
            }

            if (level === 1) {
                enemies = [
                    { x: 400, y: 110, width: 80, height: 55, hp: 15, maxHp: 15, dx: 1.2, shootTimer: 0, shootInterval: 350, bulletColor: "#ff3333", bulletSpeed: 1.8, color: "#e63946" }

                enemies = [
                    { x: 300, y: 100, width: 85, height: 60, hp: 18, maxHp: 18, dx: 1.3, shootTimer: 0, shootInterval: 350, bulletColor: "#c77dff", bulletSpeed: 1.8, color: "#9d4edd" },
                    { x: 850, y: 150, width: 85, height: 60, hp: 18, maxHp: 18, dx: -1.3, shootTimer: 0, shootInterval: 350, bulletColor: "#c77dff", bulletSpeed: 1.8, color: "#9d4edd" }
                ];
            } else if (level === 3) {
                enemies = [
                    { x: 250, y: 100, width: 85, height: 60, hp: 25, maxHp: 25, dx: 1.4, shootTimer: 0, shootInterval: 320, bulletColor: "#00f0ff", bulletSpeed: 2.0, color: "#0077b6" },
                    { x: 650, y: 150, width: 85, height: 60, hp: 25, maxHp: 25, dx: -1.4, shootTimer: 0, shootInterval: 320, bulletColor: "#00f0ff", bulletSpeed: 2.0, color: "#0077b6" },
                    { x: 1050, y: 100, width: 85, height: 60, hp: 25, maxHp: 25, dx: 1.4, shootTimer: 0, shootInterval: 320, bulletColor: "#00f0ff", bulletSpeed: 2.0, color: "#0077b6" }
                ];
            } else {
                enemies = [
                    { x: 400, y: 110, width: 80, height: 55, hp: 20 + level * 5, maxHp: 20 + level * 5, dx: 1.5, shootTimer: 0, shootInterval: 300, bulletColor: "#ff3333", bulletSpeed: 2.0, color: "#e63946" }
                ];
            }
        }

        function updateAIBot(enemy) {
            enemy.aiDecisionTimer++;
            if (enemy.aiDecisionTimer > 60) {
                let targetX = player.x + (Math.random() * 200 - 100);
                if (targetX < 50) targetX = 50;
                if (targetX > canvas.width - enemy.width - 50) targetX = canvas.width - enemy.width - 50;
                enemy.targetX = targetX;
                enemy.aiDecisionTimer = 0;
            }
            if (enemy.x < enemy.targetX) enemy.x += enemy.speed;
            else if (enemy.x > enemy.targetX) enemy.x -= enemy.speed;
            if (enemy.x <= 20) enemy.x = 20;
            if (enemy.x + enemy.width >= canvas.width - 20) enemy.x = canvas.width - enemy.width - 20;
        }

        function update() {
            if (gameState !== 'playing' || isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) return;

            if (poisonTimer > 0) {
                poisonTimer--;
                poisonTickTimer++;
                if (poisonTickTimer >= 60) { 
                    if (enemies.length > 0) {
                        enemies[0].hp -= 2;
                        if (enemies[0].hp <= 0) {
                            stats.totalEnemiesKilled++;
                            enemies.splice(0, 1);
                        }
                    }
                    poisonTickTimer = 0;
                }
            }

            if (!isBotVsMode) {
                let now = Date.now();
                if (now - lastAppleTime >= 10000) {
                    apples.push({ x: Math.random() * (canvas.width - 60), y: -40, size: 35, speed: 3.5 });
                    lastAppleTime = now;
                }
            }

            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                let bulletHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    if (bullets[i] && bullets[i].x < enemy.x + enemy.width && bullets[i].x + bullets[i].width > enemy.x && bullets[i].y < enemy.y + enemy.height && bullets[i].y + bullets[i].height > enemy.y) {
                        enemy.hp -= 1; 
                        if (bullets[i].isPoison) { poisonTimer = 240; poisonTickTimer = 0; }
                        bulletHit = true;
                        if (enemy.hp <= 0) { stats.totalEnemiesKilled++; enemies.splice(j, 1); }
                        break;
                    }
                }
                if (bulletHit || (bullets[i] && bullets[i].y < -20)) bullets.splice(i, 1);
            }

            if (enemies.length === 0) {
                if (!isTrainingMode) {
                    let earned = currentLevel * 10;
                    if (isBotVsMode) {
                        if (botDifficulty === 'kolay') earned = 5;
                        else if (botDifficulty === 'orta') earned = 10;
                        else if (botDifficulty === 'zor') earned = 15;
                    }
                    totalCoins += earned;
                    totalWins++;

                    if (!isBotVsMode) {
                        if (currentLevel === 5) titles.find(t => t.id === 'boss_slayer').unlocked = true;
                        if (currentLevel === 10) titles.find(t => t.id === 'ay_dede').unlocked = true;
                        if (!completedUniqueLevels.includes(currentLevel)) completedUniqueLevels.push(currentLevel);
                        
                        if (currentLevel === unlockedLevel && unlockedLevel < 30) {
                            unlockedLevel++;
                        }
                    }
                    saveGameData();
                }
                gameState = 'win';
                return;
            }

            enemies.forEach(enemy => {
                if (enemy.isBotEnemy) updateAIBot(enemy);
                else {
                    enemy.x += enemy.dx;
                    if (enemy.x <= 20 || enemy.x + enemy.width >= canvas.width - 20) enemy.dx *= -1;
                }

                if (!isTrainingMode) {
                    enemy.shootTimer++;
                    if (enemy.shootTimer >= enemy.shootInterval) { 
                        const startX = enemy.x + enemy.width / 2;
                        const startY = enemy.y + enemy.height;
                        const targetX = player.x + player.width / 2;
                        const targetY = player.y + player.height / 2;
                        const angle = Math.atan2(targetY - startY, targetX - startX);

                        enemyBullets.push({
                            x: startX, y: startY,
                            vx: Math.cos(angle) * enemy.bulletSpeed,
                            vy: Math.sin(angle) * enemy.bulletSpeed,
                            size: 8, color: enemy.bulletColor
                        });
                        enemy.shootTimer = 0;
                    }
                }
            });

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.vx; eb.y += eb.vy;
                if (eb.x > player.x && eb.x < player.x + player.width && eb.y > player.y && eb.y < player.y + player.height) {
                    player.hp -= 5;
                    enemyBullets.splice(i, 1);
                    if (player.hp <= 0) { player.hp = 0; gameState = 'gameover'; }
                    continue;
                }
                if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) enemyBullets.splice(i, 1);
            }

            if (!isBotVsMode) {
                for (let i = apples.length - 1; i >= 0; i--) {
                    let apple = apples[i];
                    apple.y += apple.speed;
                    if (player.x < apple.x + apple.size && player.x + player.width > apple.x && player.y < apple.y + apple.size && player.y + player.height > apple.y) {
                        player.hp = Math.min(player.maxHp, player.hp + 5);
                        appleNotificationTimer = 120;
                        apples.splice(i, 1);
                        continue;
                    }
                    if (apple.y > canvas.height + 40) apples.splice(i, 1);
                }
            }
            if (appleNotificationTimer > 0) appleNotificationTimer--;
        }

        function drawButton(btn, bgColor, hoverColor, textColor, text, fontSize = "18px", isLocked = false) {
            const hovered = isHovered(btn) && !isLocked;
            ctx.fillStyle = isLocked ? "#334155" : (hovered ? hoverColor : bgColor);
            ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
            ctx.strokeStyle = isLocked ? "#64748b" : "#ffffff";
            ctx.lineWidth = hovered ? 3 : 2;
            ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);
            ctx.fillStyle = isLocked ? "#94a3b8" : textColor;
            ctx.font = `bold ${fontSize} Arial`;
            ctx.fillText(text, btn.x + 8, btn.y + (btn.height / 2) + 6);
        }

                let currentGrid = levelPage === 1 ? page1GridBtns : page2GridBtns;
                for (let i = 0; i < currentGrid.length; i++) {
                    let lvl = levelPage === 1 ? i + 1 : 11 + i;
                    let isLocked = (lvl > unlockedLevel);
                    drawButton(currentGrid[i], "#1e293b", "#334155", "#ffffff", isLocked ? `🔒 ${lvl}` : `Seviye ${lvl}`, "16px", isLocked);
                }
                drawButton(backToMenuBtn, "#ff3366", "#fb7185", "#ffffff", "ANA EKRAN", "18px");
                return;
            }

            if (gameState === 'other_modes') {
                ctx.fillStyle = "#00ff66"; ctx.font = "bold 45px Arial"; ctx.fillText("🌀 DİĞER OYUN MODLARI", canvas.width / 2 - 230, 140);
                drawButton(trainingModeBtn, "#7209b7", "#9d4edd", "#ffffff", "🎯 EĞİTİM MODU", "20px");
                drawButton(backToMenuBtn, "#ff3366", "#fb7185", "#ffffff", "ANA EKRAN", "18px");
                return;
            }

            enemies.forEach(en => { ctx.fillStyle = en.color || "#e63946"; ctx.fillRect(en.x, en.y, en.width, en.height); });
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.width, b.height); });
            enemyBullets.forEach(eb => { ctx.fillStyle = eb.color; ctx.fillRect(eb.x, eb.y, eb.size, eb.size); });
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

            if (gameState === 'win') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff66"; ctx.font = "bold 58px Arial"; ctx.fillText("SEVİYE TAMAMLANDI!", canvas.width / 2 - 280, canvas.height / 2 - 80);
                if (!isBotVsMode && currentLevel < unlockedLevel && currentLevel < 30) drawButton(nextLevelBtn, "#00ff66", "#34d399", "#000000", "SONRAKİ SEVİYE", "20px");
                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "TEKRAR OYNA", "20px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN", "20px");
            } else if (gameState === 'gameover') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3366"; ctx.font = "bold 64px Arial"; ctx.fillText("GAME OVER", canvas.width / 2 - 195, canvas.height / 2 - 80);
                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "RESTART (R)", "22px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN (M)", "21px");
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
