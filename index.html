        async function fetchGlobalLeaderboard() {
            try {
                let response = await fetch("https://jsonplaceholder.typicode.com/users");
                let data = await response.json();
                
                // Gerçek dünyadaki örnek skorları simüle eden küresel liste havuzu

                    { name: "Kaptan Hamza", score: 12500 },
                    { name: "Yusuf Pro", score: 9800 },
                    { name: "Metehan", score: 8500 },
                    { name: "Asena", score: 7200 },
                    { name: "Eren Uzay", score: 6100 }
                ];

                // Yerelde kaydedilen oyuncuyu da ekle
                let localScore = (stats.totalEnemiesKilled * 100) + (totalWins * 500);
                if (playerName.trim() !== "") {
                    let meExist = globalList.find(p => p.name === playerName);
                    if (meExist) {
                        if (localScore > meExist.score) meExist.score = localScore;
                    } else {
                        globalList.push({ name: playerName, score: localScore });
                    }
                }

                globalList.sort((a, b) => b.score - a.score);
                return globalList;
            } catch (e) {
                return [{ name: playerName || "Kaptan", score: 1000 }];
            }
        }

        function isHovered(btn) {
            return mouseX >= btn.x && mouseX <= btn.x + btn.width && mouseY >= btn.y && mouseY <= btn.y + btn.height;
        }

        function isTouched(btn, tx, ty) {
            return tx >= btn.x && tx <= btn.x + btn.width && ty >= btn.y && ty <= btn.y + btn.height;
        }

        // İSİM KONTROL MANTIĞI VE KLAVYE AÇMA
        function handleNameSubmission() {
            let enteredName = hiddenInput.value.trim();
            if (enteredName === "") {
                nameErrorMsg = "Lütfen boş bırakma!";
                return;
            }

            // Yasaklı/Alınmış isim kontrolü
            let forbiddenNames = ["Yusuf Pro", "Metehan", "Asena", "Eren Uzay", "Admin"];
            if (forbiddenNames.includes(enteredName)) {
                nameErrorMsg = "⚠️ Bu isim zaten başkası tarafından kullanılıyor!";
                return;
            }

            playerName = enteredName;
            nameErrorMsg = "";
            hiddenInput.style.display = 'none';
            gameState = 'start';
            saveGameData();
        }

        window.addEventListener("click", () => {
            if (gameState === 'name_entry') {
                hiddenInput.focus(); // Telefondan veya bilgisayardan tıklandığında klavyeyi açar
            }
        });

        hiddenInput.addEventListener("input", (e) => {
            if (gameState === 'name_entry') {
                playerName = hiddenInput.value;
            }
        });

        hiddenInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && gameState === 'name_entry') {
                handleNameSubmission();
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            touchLeftActive = false;
            touchRightActive = false;

            for (let i = 0; i < e.touches.length; i++) {
                let tx = (e.touches[i].clientX - rect.left) * scaleX;
                let ty = (e.touches[i].clientY - rect.top) * scaleY;
                mouseX = tx;
                mouseY = ty;

                if (gameState === 'playing') {
                    if (isTouched(touchLeftBtn, tx, ty)) touchLeftActive = true;
                    if (isTouched(touchRightBtn, tx, ty)) touchRightActive = true;
                    if (isTouched(touchShootBtn, tx, ty)) shoot();
                }
            }

            if (gameState === 'name_entry') {
                hiddenInput.focus(); // Telefondan ekrana dokunulduğunda sanal klavye açılır
            }

            handleCanvasClickOrTouch();
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            touchLeftActive = false;
            touchRightActive = false;

            for (let i = 0; i < e.touches.length; i++) {
                let tx = (e.touches[i].clientX - rect.left) * scaleX;
                let ty = (e.touches[i].clientY - rect.top) * scaleY;
                if (gameState === 'playing') {
                    if (isTouched(touchLeftBtn, tx, ty)) touchLeftActive = true;
                    if (isTouched(touchRightBtn, tx, ty)) touchRightActive = true;
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            touchLeftActive = false;
            touchRightActive = false;
        }, { passive: false });

        window.addEventListener("keydown", (e) => {
            if (gameState === 'name_entry') return;

            if (isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) {

                stats.totalBulletsFired += 2;
            } else {
                bullets.push({ x: player.x + player.width / 2 - 3, y: player.y + 20, width: 6, height: 18, color: col, isPoison: isP });

            enemies = [];
            if (isBotVsMode) {

                    { x: 500, y: 150, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: -1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" },
                    { x: 850, y: 100, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: 1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" }

                    { x: 900, y: 110, width: 75, height: 50, hp: 70 + (level * 2), maxHp: 70 + (level * 2), dx: -1.6, shootTimer: 0, shootInterval: 280, bulletColor: "#00f0ff", bulletSpeed: 2.2, color: "#0077b6" }
                ];
                return;
            }
            if (level === 1) enemies = [{ x: 400, y: 110, width: 80, height: 55, hp: 15, maxHp: 15, dx: 1.2, shootTimer: 0, shootInterval: 350, bulletColor: "#ff3333", bulletSpeed: 1.8, color: "#e63946" }, { x: 1250, y: 160, width: 80, height: 55, hp: 15, maxHp: 15, dx: -1.2, shootTimer: 0, shootInterval: 350, bulletColor: "#ff3333", bulletSpeed: 1.8, color: "#e63946" }];

            else enemies = [{ x: 400, y: 110, width: 80, height: 55, hp: 20 + level * 3, maxHp: 20 + level * 3, dx: 1.5, shootTimer: 0, shootInterval: 300, bulletColor: "#00f0ff", bulletSpeed: 2.0, color: "#0077b6" }];

        function update() {
            if (gameState !== 'playing' || isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) return;

            if (poisonTimer > 0) {
                poisonTimer--; poisonTickTimer++;
                if (poisonTickTimer >= 60 && enemies.length > 0) {
                    enemies[0].hp -= 2;
                    if (enemies[0].hp <= 0) { stats.totalEnemiesKilled++; enemies.splice(0, 1); }
                    poisonTickTimer = 0;
                }
            }

            if (!isBotVsMode && Date.now() - lastAppleTime >= 8000) {
                apples.push({ x: Math.random() * (canvas.width - 60), y: -40, size: 35, speed: 3.5 });
                lastAppleTime = Date.now();
            }

            if ((keys["ArrowLeft"] || touchLeftActive) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || touchRightActive) && player.x < canvas.width - player.width) player.x += player.speed;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (bullets[i] && bullets[i].x < en.x + en.width && bullets[i].x + bullets[i].width > en.x && bullets[i].y < en.y + en.height && bullets[i].y + bullets[i].height > en.y) {
                        en.hp -= 1; if (bullets[i].isPoison) { poisonTimer = 240; poisonTickTimer = 0; }
                        hit = true;
                        if (en.hp <= 0) { stats.totalEnemiesKilled++; enemies.splice(j, 1); }
                        break;
                    }
                }
                if (hit || (bullets[i] && bullets[i].y < -20)) bullets.splice(i, 1);
            }

            if (currentLevel === 5 && enemies.length === 0 && !isBossSpawned) {
                isBossSpawned = true;
                enemies = [{ x: canvas.width / 2 - 90, y: 100, width: 180, height: 110, hp: 60, maxHp: 60, dx: 2.0, shootTimer: 0, shootInterval: 240, bulletColor: "#00ff66", bulletSpeed: 1.8, color: "#2dc653", isBoss: true }];
            }

            if (enemies.length === 0) {
                if (!isTrainingMode) {
                    totalCoins += currentLevel * 10;
                    totalWins++;
                    if (!isBotVsMode) {
                        if (currentLevel === 5) titles.find(t => t.id === 'boss_slayer').unlocked = true;
                        if (currentLevel === 10) titles.find(t => t.id === 'ay_dede').unlocked = true;
                        if (!completedUniqueLevels.includes(currentLevel)) completedUniqueLevels.push(currentLevel);
                        if (currentLevel === unlockedLevel) unlockedLevel++;
                    }
                    saveGameData();
                }
                gameState = 'win';
                return;
            }

            enemies.forEach(en => {
                if (en.isBotEnemy) {
                    en.aiDecisionTimer++;
                    if (en.aiDecisionTimer > 60) { en.targetX = Math.max(50, Math.min(canvas.width - en.width - 50, player.x + (Math.random() * 200 - 100))); en.aiDecisionTimer = 0; }
                    if (en.x < en.targetX) en.x = Math.min(en.targetX, en.x + en.speed);
                    else if (en.x > en.targetX) en.x = Math.max(en.targetX, en.x - en.speed);
                } else {
                    en.x += en.dx;
                    if (en.x <= 20 || en.x + en.width >= canvas.width - 20) en.dx *= -1;
                }

                if (!isTrainingMode) {
                    en.shootTimer++;
                    if (en.shootTimer >= en.shootInterval) {
                        let sx = en.x + en.width / 2, sy = en.y + en.height;
                        let ang = Math.atan2((player.y + player.height / 2) - sy, (player.x + player.width / 2) - sx);
                        enemyBullets.push({ x: sx, y: sy, vx: Math.cos(ang) * en.bulletSpeed, vy: Math.sin(ang) * en.bulletSpeed, size: 10, color: en.bulletColor });
                        en.shootTimer = 0;
                    }
                }
            });

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy;
                if (eb.x > player.x && eb.x < player.x + player.width && eb.y > player.y && eb.y < player.y + player.height) {
                    player.hp -= 5; enemyBullets.splice(i, 1);
                    if (player.hp <= 0) { player.hp = 0; gameState = 'gameover'; }
                    continue;
                }
                if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1);
            }
        }

                        ctx.strokeStyle = isMe ? "#00ff66" : "#555";
                        ctx.strokeRect(200, lbY, canvas.width - 400, 55);

                        ctx.fillStyle = isMe ? "#00ff66" : "#ffffff";
                        ctx.font = "bold 22px Arial";
                        ctx.fillText(`${idx + 1}. ${medal}  ${p.name} ${isMe ? "(SEN)" : ""}`, 230, lbY + 36);

                        ctx.fillStyle = "#ffd700";
                        ctx.fillText(`${p.score} Puan`, canvas.width - 380, lbY + 36);
                        lbY += 68;
                    });

                    drawButton(closeProfileBtn, "#ff3366", "#fb7185", "#ffffff", "KAPAT", "20px");
                }
                return;
            }

            // OYUN İÇİ ÇİZİMLER
            enemies.forEach(en => {
                ctx.fillStyle = en.color; ctx.fillRect(en.x, en.y, en.width, en.height);
            });
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.width, b.height); });
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

            if (gameState === 'playing') {
                ctx.fillStyle = touchLeftActive ? "rgba(0, 210, 255, 0.7)" : "rgba(0, 210, 255, 0.3)";
                ctx.fillRect(touchLeftBtn.x, touchLeftBtn.y, touchLeftBtn.width, touchLeftBtn.height);
                ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(touchLeftBtn.x, touchLeftBtn.y, touchLeftBtn.width, touchLeftBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 45px Arial"; ctx.fillText("⬅️", touchLeftBtn.x + 22, touchLeftBtn.y + 82);

                ctx.fillStyle = touchRightActive ? "rgba(0, 210, 255, 0.7)" : "rgba(0, 210, 255, 0.3)";
                ctx.fillRect(touchRightBtn.x, touchRightBtn.y, touchRightBtn.width, touchRightBtn.height);
                ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(touchRightBtn.x, touchRightBtn.y, touchRightBtn.width, touchRightBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 45px Arial"; ctx.fillText("➡️", touchRightBtn.x + 22, touchRightBtn.y + 82);

                ctx.fillStyle = "rgba(255, 51, 102, 0.4)";
                ctx.fillRect(touchShootBtn.x, touchShootBtn.y, touchShootBtn.width, touchShootBtn.height);
                ctx.strokeStyle = "#ff3366"; ctx.strokeRect(touchShootBtn.x, touchShootBtn.y, touchShootBtn.width, touchShootBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial"; ctx.fillText("🔥 ATEŞ", touchShootBtn.x + 22, touchShootBtn.y + 72);
            }

            if (gameState === 'win') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff66"; ctx.font = "bold 58px Arial"; ctx.fillText("SEVİYE TAMAMLANDI!", canvas.width / 2 - 280, canvas.height / 2 - 80);
                drawButton(restartBtn, "#00ff66", "#34d399", "#000000", "TEKRAR OYNA (R)", "20px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN (M)", "20px");
            }

            if (gameState === 'gameover') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3366"; ctx.font = "bold 64px Arial"; ctx.fillText("GAME OVER", canvas.width / 2 - 195, canvas.height / 2 - 80);
                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "TEKRAR DENE", "22px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN", "21px");
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
