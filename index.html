        function isHovered(btn) {
            return mouseX >= btn.x && mouseX <= btn.x + btn.width && mouseY >= btn.y && mouseY <= btn.y + btn.height;
        }

        function drawWrappedText(text, x, y, maxWidth, lineHeight, defaultColor, highlightColor) {
            let paragraphs = text.split('\n');
            let currentY = y;

            paragraphs.forEach(paragraph => {
                let words = paragraph.split(' ');
                let currentLine = '';
                let isHighlight = paragraph.includes("💡 OYUN İPUCU:");

                ctx.fillStyle = isHighlight ? highlightColor : defaultColor;
                ctx.font = isHighlight ? "bold 16px Arial" : "15px Arial";

                words.forEach((word, index) => {
                    let testLine = currentLine + word + ' ';
                    let metrics = ctx.measureText(testLine);
                    let testWidth = metrics.width;

                    if (testWidth > maxWidth && index > 0) {
                        ctx.fillText(currentLine.trim(), x, currentY);
                        currentLine = word + ' ';
                        currentY += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                });
                ctx.fillText(currentLine.trim(), x, currentY);
                currentY += lineHeight;
            });
        }

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
        });

        window.addEventListener("keydown", (e) => {
            // İSİM GİRİŞ EKRANINDA TUŞ KONTROLÜ
            if (gameState === 'name_entry') {
                if (e.key === "Enter") {
                    if (playerName.trim() !== "") {
                        gameState = 'start';
                    } else {
                        alert("Lütfen geçerli bir isim gir!");
                    }
                } else if (e.key === "Backspace") {
                    playerName = playerName.slice(0, -1);
                } else if (e.key.length === 1 && playerName.length < 15) {
                    playerName += e.key;
                }
                return;
            }

            if (isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) {
                if (e.code === "Escape") {
                    if (selectedCelestialBody) {
                        selectedCelestialBody = null;
                    } else {
                        isShopOpen = false;
                        isWarriorsOpen = false;
                        isHelpOpen = false;
                        isProfileOpen = false;
                        isNewsOpen = false;
                        isQuestsOpen = false;
                        isUniverseMapOpen = false;
                        isTitlesOpen = false;
                        isSpaceStationOpen = false;
                    }
                }
                return;
            }

            if (gameState === 'start' || gameState === 'level_select' || gameState === 'other_modes') {
                if (e.code === "Escape") {
                    if (gameState === 'other_modes' && isBotVsMode) {
                        isBotVsMode = false;
                        botVsState = 'select_char';
                    } else {
                        gameState = 'start';
                    }
                }
                return;
            }

            if (gameState === 'win') {
                if (e.code === "KeyS" || e.code === "KeyN") {
                    if (!isBotVsMode && currentLevel < 30) {
                        startPlaying(currentLevel + 1);
                    }
                } else if (e.code === "KeyR" || e.code === "Enter") {
                    if (isBotVsMode) {
                        startBotVsBattle();
                    } else {
                        startPlaying(currentLevel);
                    }
                } else if (e.code === "KeyM") {
                    goToMainMenu();
                }
                return;
            }

            if (gameState === 'gameover') {
                if (e.code === "KeyR" || e.code === "Enter") {
                    if (isBotVsMode) {
                        startBotVsBattle();
                    } else {
                        startPlaying(currentLevel);
                    }
                } else if (e.code === "KeyM") {
                    goToMainMenu();
                }
                return;
            }

            if (gameState === 'playing' && e.code === "KeyQ") {
                if (hasPoisonBullet && isPoisonBulletEquipped && poisonAmmoCount > 0 && !isPoisonActive) {
                    isPoisonActive = true;
                    poisonAmmoCount--;
                    poisonTimer = 240; 
                }
            }

            if (e.code === "Space" && !keys["Space"]) {
                shoot();
            }
            keys[e.code] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;

                    selectedCelestialBody = null;
                }
                return;
            }

                if (isHovered(closeSpaceStationBtn)) {
                    isSpaceStationOpen = false;

                } else {
                    for (let i = 0; i < celestialButtons.length; i++) {
                        if (isHovered(celestialButtons[i])) {
                            selectedCelestialBody = celestialData[celestialButtons[i].id];
                            break;
                        }
                    }
                }
                return;
            }

            if (isTitlesOpen) {
                if (isHovered(closeTitlesBtn)) isTitlesOpen = false;
                return;
            }

            if (isUniverseMapOpen) {
                if (isHovered(closeUniverseMapBtn)) isUniverseMapOpen = false;
                return;
            }

            if (gameState === 'playing' && (isTrainingMode || isBotVsMode)) {
                if (isHovered(exitTrainingBtn)) {
                    goToMainMenu();
                    return;
                }
            }

            if (isNewsOpen) {
                if (isHovered(closeNewsBtn)) isNewsOpen = false;
                return;
            }

            if (isQuestsOpen) {
                if (isHovered(closeQuestsBtn)) isQuestsOpen = false;
                
                if (!quest1Claimed && quest1Completed && isHovered(claimQuest1Btn)) {
                    totalCoins += 50;
                    quest1Claimed = true;
                }
                if (!quest2Claimed && quest2Completed && isHovered(claimQuest2Btn)) {
                    totalCoins += 100;
                    quest2Claimed = true;
                }
                return;
            }

            if (isShopOpen) {
                if (isHovered(catEfektBtn)) shopCategory = 'efekt';
                if (isHovered(catOzelGucBtn)) shopCategory = 'ozel_guc';
                if (isHovered(catSavasciBtn)) shopCategory = 'savasci';

                if (shopCategory === 'savasci') {
                    if (isHovered(buyAlienBtn)) {
                        if (!hasAlienWarrior && totalCoins >= 15000) {
                            totalCoins -= 15000;
                            hasAlienWarrior = true;
                            selectedWarrior = 'alien';
                        }
                    }
                    if (isHovered(buyDogBtn)) {
                        if (!hasDogWarrior && totalCoins >= 14000) {
                            totalCoins -= 14000;
                            hasDogWarrior = true;
                            selectedWarrior = 'dog';
                        }
                    }
                }

                if (shopCategory === 'ozel_guc') {
                    if (isHovered(buyDoubleShotBtn)) {
                        if (!hasDoubleShot) {
                            if (totalCoins >= 1000) {
                                totalCoins -= 1000;
                                hasDoubleShot = true;
                                isDoubleShotEquipped = true;
                            }
                        } else {
                            isDoubleShotEquipped = !isDoubleShotEquipped;
                        }
                    }
                    if (isHovered(buyPoisonBulletBtn)) {
                        if (!hasPoisonBullet) {
                            if (totalCoins >= 1200) {
                                totalCoins -= 1200;
                                hasPoisonBullet = true;
                                isPoisonBulletEquipped = true;
                            }
                        } else {
                            isPoisonBulletEquipped = !isPoisonBulletEquipped;
                        }
                    }
                }

                if (shopCategory === 'efekt') {
                    if (isHovered(buyBordoEffectBtn)) {
                        if (!hasBordoEffect) {
                            if (totalCoins >= 550) {
                                totalCoins -= 550;
                                hasBordoEffect = true;
                                isBordoEffectEquipped = true;
                                isOrangeEffectEquipped = false;
                            }
                        } else {
                            isBordoEffectEquipped = !isBordoEffectEquipped;
                            if (isBordoEffectEquipped) isOrangeEffectEquipped = false;
                        }
                    }

                    if (isHovered(buyOrangeEffectBtn)) {
                        if (!hasOrangeEffect) {

        function updateAIBot(enemy) {
            enemy.aiDecisionTimer++;
            if (enemy.aiDecisionTimer > 60) {
                let targetX = player.x + (Math.random() * 200 - 100);
                if (targetX < 50) targetX = 50;
                if (targetX > canvas.width - enemy.width - 50) targetX = canvas.width - enemy.width - 50;
                enemy.targetX = targetX;
                enemy.aiDecisionTimer = 0;
            }

            if (enemy.x < enemy.targetX) {
                enemy.x += enemy.speed;
                if (enemy.x > enemy.targetX) enemy.x = enemy.targetX;
            } else if (enemy.x > enemy.targetX) {
                enemy.x -= enemy.speed;
                if (enemy.x < enemy.targetX) enemy.x = enemy.targetX;
            }

            if (enemy.x <= 20) enemy.x = 20;
            if (enemy.x + enemy.width >= canvas.width - 20) enemy.x = canvas.width - enemy.width - 20;
        }

        function update() {
            if (typeof updateBgMusicState === 'function') updateBgMusicState();

            if (gameState !== 'playing' || isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) return;

            if (poisonTimer > 0) {
                poisonTimer--;
                poisonTickTimer++;
                if (poisonTickTimer >= 60) { 
                    if (enemies.length > 0) {
                        enemies[0].hp -= 2;
                        if (enemies[0].hp <= 0) {
                            stats.totalEnemiesKilled++;
                            enemies.splice(0, 1);
                        }
                    }
                    poisonTickTimer = 0;
                }
            }

            if (!isBotVsMode) {
                let requiredInterval = (currentLevel === 10) ? 10000 : (currentLevel >= 11) ? 6000 : (currentLevel === 9) ? 4000 : (currentLevel === 8) ? 7000 : (currentLevel === 7) ? 10000 : (currentLevel >= 5) ? 3000 : (currentLevel >= 3) ? 15000 : 5000;
                let now = Date.now();
                if (now - lastAppleTime >= requiredInterval) {
                    const randomX = Math.random() * (canvas.width - 60);
                    apples.push({
                        x: randomX,
                        y: -40,
                        size: 35,
                        speed: 3.5
                    });
                    lastAppleTime = now;
                }
            }

            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;

                let bulletHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    if (
                        bullets[i] &&
                        bullets[i].x < enemy.x + enemy.width &&
                        bullets[i].x + bullets[i].width > enemy.x &&
                        bullets[i].y < enemy.y + enemy.height &&
                        bullets[i].y + bullets[i].height > enemy.y
                    ) {
                        enemy.hp -= 1; 
                        if (bullets[i].isPoison) {
                            poisonTimer = 240; 
                            poisonTickTimer = 0;
                        }
                        bulletHit = true;

                        if (enemy.hp <= 0) {
                            stats.totalEnemiesKilled++;
                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }

                if (bulletHit || (bullets[i] && bullets[i].y < -20)) {
                    bullets.splice(i, 1);
                }
            }

            if (currentLevel === 5 && enemies.length === 0 && !isBossSpawned) {
                isBossSpawned = true;
                enemies = [
                    { x: canvas.width / 2 - 90, y: 100, width: 180, height: 110, hp: 60, maxHp: 60, dx: 2.0, shootTimer: 0, shootInterval: 240, bulletColor: "#00ff66", bulletSpeed: 1.8, color: "#2dc653", isBoss: true }

            }

            if (currentLevel === 10 && enemies.length === 0 && !isSinsiBossStage) {
                isSinsiBossStage = true;
                enemies = [
                    { x: canvas.width / 2 - 50, y: 120, width: 100, height: 70, hp: 80, maxHp: 80, dx: 0, shootTimer: 0, shootInterval: 300, bulletColor: "#ff0055", bulletSpeed: 2.0, color: "#7209b7", isSinsiBoss: true }
                ];
            }

            if (isSinsiBossStage && enemies.length > 0 && enemies[0].isSinsiBoss) {
                sinsiTeleportTimer++;
                if (sinsiTeleportTimer >= 150) {
                    enemies[0].x = Math.random() * (canvas.width - 200) + 100;
                    enemies[0].y = Math.random() * 200 + 80;
                    sinsiTeleportTimer = 0;
                }
            }

            if (enemies.length === 0 && (!isSinsiBossStage || (currentLevel === 10 && isSinsiBossStage))) {
                if (!isTrainingMode) {
                    let earned = currentLevel * 10;
                    if (isBotVsMode) {
                        if (botDifficulty === 'kolay') earned = 5;
                        else if (botDifficulty === 'orta') earned = 10;
                        else if (botDifficulty === 'zor') earned = 15;
                    }
                    totalCoins += earned;
                    totalWins++;

                    if (!isBotVsMode) {
                        if (currentLevel === 5) {
                            titles.find(t => t.id === 'boss_slayer').unlocked = true;
                        }

                        if (currentLevel === 10) {
                            titles.find(t => t.id === 'ay_dede').unlocked = true;
                        }

                        if (!completedUniqueLevels.includes(currentLevel)) {
                            completedUniqueLevels.push(currentLevel);
                        }

                        if (currentLevel === unlockedLevel) {
                            unlockedLevel++;
                        }
                    }

                    if (currentLevel === 1 && !isBotVsMode) {
                        if (!quest1Completed) {
                            quest1Progress++;
                            if (quest1Progress >= 2) quest1Completed = true;
                        }
                    } else if (currentLevel === 2 && !isBotVsMode) {
                        if (!quest2Completed) {
                            quest2Progress++;
                            if (quest2Progress >= 1) quest2Completed = true;
                        }
                    }
                }

                if (typeof playWinSound === 'function') playWinSound();
                gameState = 'win';
                return;
            }

            enemies.forEach(enemy => {
                if (enemy.isBotEnemy) {
                    updateAIBot(enemy);
                } else if (!enemy.isSinsiBoss) {
                    enemy.x += enemy.dx;
                    if (enemy.x <= 20 || enemy.x + enemy.width >= canvas.width - 20) {
                        enemy.dx *= -1;
                    }
                }

                if (!isTrainingMode) {
                    enemy.shootTimer++;
                    if (enemy.shootTimer >= enemy.shootInterval) { 
                        const startX = enemy.x + enemy.width / 2;
                        const startY = enemy.y + enemy.height;

                        if (enemy.isBoss) {
                            const angles = [-0.4, -0.2, 0, 0.2, 0.4];
                            angles.forEach(ang => {
                                enemyBullets.push({
                                    x: startX,
                                    y: startY,
                                    vx: Math.sin(ang) * 1.5,
                                    vy: Math.cos(ang) * 1.5,
                                    size: 12,
                                    color: "#00ff66"
                                });
                            });
                        } else {
                            const targetX = player.x + player.width / 2;
                            const targetY = player.y + player.height / 2;
                            const angle = Math.atan2(targetY - startY, targetX - startX);

                            enemyBullets.push({
                                x: startX,
                                y: startY,
                                vx: Math.cos(angle) * enemy.bulletSpeed,
                                vy: Math.sin(angle) * enemy.bulletSpeed,
                                size: (enemy.isSinsiBoss || currentLevel >= 6) ? 12 : 8,
                                color: enemy.bulletColor
                            });
                        }

                        enemy.shootTimer = 0;
                    }
                }
            });

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.vx;
                eb.y += eb.vy;

                if (
                    eb.x > player.x &&
                    eb.x < player.x + player.width &&
                    eb.y > player.y &&
                    eb.y < player.y + player.height
                ) {
                    player.hp -= 5;
                    enemyBullets.splice(i, 1);

                    if (player.hp <= 0) {
                        player.hp = 0;
                        if (typeof playGameOverSound === 'function') playGameOverSound();
                        gameState = 'gameover';
                    }
                    continue;
                }

                if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
                    enemyBullets.splice(i, 1);
                }
            }

            if (!isBotVsMode) {
                for (let i = apples.length - 1; i >= 0; i--) {
                    let apple = apples[i];
                    apple.y += apple.speed;

                    if (
                        player.x < apple.x + apple.size &&
                        player.x + player.width > apple.x &&
                        player.y < apple.y + apple.size &&
                        player.y + player.height > apple.y
                    ) {
                        player.hp = Math.min(player.maxHp, player.hp + 5);
                        appleNotificationTimer = 120;
                        apples.splice(i, 1);
                        continue;
                    }

                    if (apple.y > canvas.height + 40) {
                        apples.splice(i, 1);
                    }
                }
            }

            if (appleNotificationTimer > 0) appleNotificationTimer--;
        }

        function drawButton(btn, bgColor, hoverColor, textColor, text, fontSize = "18px", isLocked = false) {
            const hovered = isHovered(btn) && !isLocked;
            ctx.fillStyle = isLocked ? "#334155" : (hovered ? hoverColor : bgColor);
            
            const scaleOffset = hovered ? 4 : 0;
            ctx.fillRect(btn.x - scaleOffset / 2, btn.y - scaleOffset / 2, btn.width + scaleOffset, btn.height + scaleOffset);

            ctx.strokeStyle = isLocked ? "#64748b" : "#ffffff";
            ctx.lineWidth = hovered ? 3 : 2;
            ctx.strokeRect(btn.x - scaleOffset / 2, btn.y - scaleOffset / 2, btn.width + scaleOffset, btn.height + scaleOffset);

            ctx.fillStyle = isLocked ? "#94a3b8" : textColor;
            ctx.font = `bold ${fontSize} Arial`;
            ctx.fillText(text, btn.x + 8, btn.y + (btn.height / 2) + 6);
        }

                }

                const barWidth = enemy.width;
                const hpWidth = (enemy.hp / enemy.maxHp) * barWidth;
                ctx.fillStyle = "#000000";
                ctx.fillRect(enemy.x, enemy.y - 22, barWidth, 12);
                ctx.fillStyle = (enemy.isBoss || enemy.isSinsiBoss || currentLevel >= 6) ? "#ff0055" : "#00ff66";
                ctx.fillRect(enemy.x, enemy.y - 22, hpWidth, 12);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1;
                ctx.strokeRect(enemy.x, enemy.y - 22, barWidth, 12);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px Arial";
                ctx.fillText(enemy.hp + "/" + enemy.maxHp, enemy.x + 2, enemy.y - 25);

                if (enemy.isBotEnemy) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = "bold 14px Arial";
                    let botName = enemy.botCharType === 'alien' ? "YAPAY ZEKA (UZAYLI)" : enemy.botCharType === 'dog' ? "YAPAY ZEKA (KÖPEK)" : `YAPAY ZEKA (${playerName.toUpperCase()})`;
                    ctx.fillText(`🧠 ${botName}`, enemy.x - 30, enemy.y - 38);
                } else if (enemy.isSinsiBoss) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = "bold 15px Arial";
                    ctx.fillText("☠️ SİNSİ BOSS", enemy.x + enemy.width / 2 - 50, enemy.y - 38);
                } else if (enemy.isBoss) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = "bold 16px Arial";
                    ctx.fillText("👑 DEV BOSS (YELPAZE SALDIRISI)", enemy.x + enemy.width / 2 - 110, enemy.y - 38);
                } else if (currentLevel >= 11) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = "bold 12px Arial";
                    ctx.fillText("🌕 AY DÜŞMANI", enemy.x + enemy.width / 2 - 35, enemy.y - 38);
                }
            });

            enemyBullets.forEach(eb => {
                ctx.fillStyle = eb.color;
                ctx.shadowColor = eb.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            if (!isBotVsMode) {
                apples.forEach(apple => {
                    ctx.fillStyle = "#ffd700";
                    ctx.shadowColor = "#ffea00";
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(apple.x + apple.size / 2, apple.y + apple.size / 2, apple.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#228b22";
                    ctx.shadowBlur = 0;
                    ctx.fillRect(apple.x + apple.size / 2 - 2, apple.y - 6, 4, 12);
                });
            }

            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });

            let currentWarriorImg = playerImg;
            if (selectedWarrior === 'dog' && dogImg.complete && dogImg.naturalWidth !== 0) {
                currentWarriorImg = dogImg;
            } else if (selectedWarrior === 'alien' && alienImg.complete && alienImg.naturalWidth !== 0) {
                currentWarriorImg = alienImg;
            }

            if (currentWarriorImg.complete && currentWarriorImg.naturalWidth !== 0) {
                ctx.drawImage(currentWarriorImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#00d2ff";
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 21px Arial";
            ctx.fillText("TOPLAM CAN:", 45, 52);
            ctx.fillStyle = "#222222";
            ctx.fillRect(205, 30, 240, 26);
            ctx.fillStyle = player.hp > (player.maxHp * 0.3) ? "#00ff66" : "#ff3333";
            ctx.fillRect(205, 30, (player.hp / player.maxHp) * 240, 26);
            ctx.strokeStyle = "#ffffff";
            ctx.strokeRect(205, 30, 240, 26);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Arial";
            ctx.fillText(player.hp + " / " + player.maxHp, 295, 48);

            if (isTrainingMode) {
                ctx.fillStyle = "#7209b7";
                ctx.font = "bold 22px Arial";
                ctx.fillText("🎯 EĞİTİM ALANI", canvas.width / 2 - 80, 52);

                drawButton(exitTrainingBtn, "#ff3366", "#fb7185", "#ffffff", "🚪 ÇIKIŞ", "18px");
            } else if (isBotVsMode) {
                ctx.fillStyle = "#00d2ff";
                ctx.font = "bold 22px Arial";
                ctx.fillText(`🧠 YAPAY ZEKA SAVAŞI (${botDifficulty.toUpperCase()})`, canvas.width / 2 - 160, 52);

                drawButton(exitTrainingBtn, "#ff3366", "#fb7185", "#ffffff", "🚪 ÇIKIŞ", "18px");
            } else {
                ctx.fillStyle = currentLevel >= 11 ? "#e056fd" : "#00d2ff";
                ctx.font = "bold 21px Arial";
                ctx.fillText(currentLevel >= 11 ? `🌕 SEVİYE: ${currentLevel} (AY GÖREVİ)` : "SEVİYE: " + currentLevel, canvas.width - 350, 52);
            }

            if (hasPoisonBullet && isPoisonBulletEquipped) {
                ctx.fillStyle = isPoisonActive ? "#00ff66" : "#ffffff";
                ctx.font = "bold 18px Arial";
                ctx.fillText(`🧪 Zehir Hakkı: ${poisonAmmoCount}/3 ${isPoisonActive ? "(Q Aktif!)" : "(Q'ya Bas)"}`, canvas.width / 2 - 130, 85);
            }

            if (poisonTimer > 0) {
                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 24px Arial";
                ctx.fillText("☣️ RAKİP ZEHİRLİ!", canvas.width / 2 - 100, 115);
            }

            if (appleNotificationTimer > 0) {
                ctx.fillStyle = "#ffd700";
                ctx.font = "bold 32px Arial";
                ctx.fillText("🍎 +5 CAN KAZANILDI!", canvas.width / 2 - 160, 115);
            }

            if (gameState === 'win') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ff66";
                ctx.font = "bold 58px Arial";
                let winText = isTrainingMode ? "EĞİTİM TAMAMLANDI!" : isBotVsMode ? "YAPAY ZEKA MAĞLUP EDİLDİ!" : `SEVİYE ${currentLevel} TAMAMLANDI!`;
                ctx.fillText(winText, canvas.width / 2 - 340, canvas.height / 2 - 110);

                if (!isTrainingMode) {
                    ctx.fillStyle = "#ffd700";
                    ctx.font = "bold 32px Arial";
                    let earnedCoins = currentLevel * 10;
                    if (isBotVsMode) {
                        if (botDifficulty === 'kolay') earnedCoins = 5;
                        else if (botDifficulty === 'orta') earnedCoins = 10;
                        else if (botDifficulty === 'zor') earnedCoins = 15;
                    }
                    ctx.fillText("🪙 +" + earnedCoins + " Akçe Kazandın!", canvas.width / 2 - 160, canvas.height / 2 - 50);
                }

                if (!isBotVsMode && currentLevel < 30) {
                    drawButton(nextLevelBtn, "#00d2ff", "#38bdf8", "#000000", `SONRAKİ SEVİYE (${currentLevel + 1}) ➡️ (S)`, "20px");
                }

                drawButton(restartBtn, "#00ff66", "#34d399", "#000000", "TEKRAR OYNA (R)", "20px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRANA DÖN (M)", "20px");
            }

            if (gameState === 'gameover') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 64px Arial";
                ctx.fillText("GAME OVER", canvas.width / 2 - 195, canvas.height / 2 - 80);

                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "RESTART (R)", "22px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRANA DÖN (M)", "21px");
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
