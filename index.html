<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uzay Macerası</title>
    <style>
        body {
            margin: 0;
            background-color: #07071a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #07071a;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #hiddenInput {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <input type="text" id="hiddenInput" maxlength="15">
    <canvas id="gameCanvas" width="1600" height="900"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const hiddenInput = document.getElementById("hiddenInput");

        let mouseX = 0, mouseY = 0, keys = {};
        let playerName = "";
        let nameInputRect = { x: canvas.width / 2 - 200, y: canvas.height / 2 - 20, width: 400, height: 60 };
        let nameSubmitBtn = { x: canvas.width / 2 - 140, y: canvas.height / 2 + 60, width: 280, height: 60 };
        let nameErrorMsg = "";

        let gameState = 'name_entry'; 
        let currentLevel = 1, unlockedLevel = 1, levelPage = 1, completedUniqueLevels = [];
        let totalCoins = 0, totalWins = 0;
        let stats = { totalEnemiesKilled: 0, totalBulletsFired: 0 };

        const touchLeftBtn = { x: 50, y: canvas.height - 180, width: 130, height: 130 };
        const touchRightBtn = { x: 200, y: canvas.height - 180, width: 130, height: 130 };
        const touchShootBtn = { x: canvas.width - 180, y: canvas.height - 180, width: 130, height: 130 };
        let touchLeftActive = false, touchRightActive = false;

        function saveGameData() {
            const gameData = {
                playerName, currentLevel, unlockedLevel, completedUniqueLevels,
                totalCoins, totalWins, hasAlienWarrior, hasDogWarrior, selectedWarrior,
                hasBordoEffect, isBordoEffectEquipped, hasOrangeEffect, isOrangeEffectEquipped,
                hasDoubleShot, isDoubleShotEquipped, hasPoisonBullet, isPoisonBulletEquipped,
                stats, titles
            };
            localStorage.setItem("kaptanHamzaUzaySave", JSON.stringify(gameData));
        }

        function loadGameData() {
            const savedData = localStorage.getItem("kaptanHamzaUzaySave");
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    playerName = data.playerName || "";
                    currentLevel = data.currentLevel || 1;
                    unlockedLevel = data.unlockedLevel || 1;
                    completedUniqueLevels = data.completedUniqueLevels || [];
                    totalCoins = data.totalCoins || 0;
                    totalWins = data.totalWins || 0;
                    hasAlienWarrior = data.hasAlienWarrior || false;
                    hasDogWarrior = data.hasDogWarrior || false;
                    selectedWarrior = data.selectedWarrior || 'hamza';
                    hasBordoEffect = data.hasBordoEffect || false;
                    isBordoEffectEquipped = data.isBordoEffectEquipped || false;
                    hasOrangeEffect = data.hasOrangeEffect || false;
                    isOrangeEffectEquipped = data.isOrangeEffectEquipped || false;
                    hasDoubleShot = data.hasDoubleShot || false;
                    isDoubleShotEquipped = data.isDoubleShotEquipped || false;
                    hasPoisonBullet = data.hasPoisonBullet || false;
                    isPoisonBulletEquipped = data.isPoisonBulletEquipped || false;
                    stats = data.stats || { totalEnemiesKilled: 0, totalBulletsFired: 0 };
                    
                    if (data.titles) {
                        data.titles.forEach(savedTitle => {
                            let t = titles.find(item => item.id === savedTitle.id);
                            if (t) t.unlocked = savedTitle.unlocked;
                        });
                    }

                    if (playerName.trim() !== "") {
                        gameState = 'start';
                        hiddenInput.style.display = 'none';
                    }
                } catch (e) {}
            }
        }
        loadGameData();

        let shopCategory = 'efekt';
        let isShopOpen = false, isWarriorsOpen = false, isHelpOpen = false, isProfileOpen = false, isNewsOpen = false, isQuestsOpen = false, isUniverseMapOpen = false, isTitlesOpen = false, isSpaceStationOpen = false;
        let selectedCelestialBody = null;
        let isTrainingMode = false, isBotVsMode = false;
        let botVsState = 'select_char', selectedBotCharacter = 'hamza', botDifficulty = 'orta';

        let selectedWarrior = 'hamza';
        let hasAlienWarrior = false, hasDogWarrior = false;
        let hasBordoEffect = false, isBordoEffectEquipped = false;
        let hasOrangeEffect = false, isOrangeEffectEquipped = false;
        let hasDoubleShot = false, isDoubleShotEquipped = false;
        let hasPoisonBullet = false, isPoisonBulletEquipped = false;
        let poisonAmmoCount = 3, isPoisonActive = false, poisonTimer = 0, poisonTickTimer = 0;

        let playerWidth = 70, playerHeight = 85;
        let player = { x: canvas.width / 2 - playerWidth / 2, y: canvas.height - playerHeight - 25, width: playerWidth, height: playerHeight, speed: 9, hp: 100, maxHp: 100 };

        let bullets = [], bulletSpeed = 12, enemies = [], enemyBullets = [], apples = [];
        let lastAppleTime = Date.now(), isBossSpawned = false;

        const playerImg = new Image(); playerImg.src = 'astronot_11.png';
        const alienImg = new Image(); alienImg.src = 'Uzaylı.png';
        const dogImg = new Image(); dogImg.src = 'köpek_3.png';

        const titles = [
            { id: 'novice', name: '🌌 Çırak Uzaycı', desc: 'Oyuna ilk adımını atan cesur pilot.', unlocked: true },
            { id: 'boss_slayer', name: '👑 Boss Katili', desc: '5. Seviyedeki dev boss\'u alt eden efsane.', unlocked: false },
            { id: 'ay_dede', name: '🌕 Ay Fatihi', desc: '10. Seviye Ay görevini başarıyla tamamlayan kahraman.', unlocked: false }
        ];

        const celestialData = {
            gunes: { name: "⭐ GÜNEŞ (Sistemin Kalbi)", info: "Güneş, Güneş Sistemi'nin merkezinde yer alan devasa bir yıldızdır.\n\n💡 OYUN İPUCU: Güneş'in enerjisi kalkan sağlar!" },
            merkur: { name: "🪐 MERKÜR (En İçteki Gezegen)", info: "Güneş'e en yakın gezegendir. Yüzeyi aşırı sıcak ve kraterlerle doludur." },
            venus: { name: "🪐 VENÜS (Sıcak Cehennem)", info: "Güneş sisteminin en sıcak gezegenidir. Kalın atmosferi zehirli gazlardan oluşur." },
            dunya: { name: "🌍 DÜNYA (Evimiz)", info: "Üzerinde su barındıran, yaşamın olduğu bilinen tek gezegendir." },
            ay: { name: "🌕 AY (Dünya'nın Uydusu)", info: "Dünya'nın tek doğal uydusudur. 10. Seviyeden sonra maceralar burada başlar!" },
            mars: { name: "🔴 MARS (Kızıl Gezegen)", info: "Paslı demir toprakları yüzünden kırmızı görünür." },
            jupiter: { name: "⚡ JÜPİTER (Dev Gaz Devi)", info: "Sistemin en büyük gezegenidir." },
            saturn: { name: "💫 SATÜRN (Halkaların Efendisi)", info: "Buz ve kayalardan oluşan muhteşem halkalarıyla ünlüdür." },
            uranus: { name: "❄️ URANÜS (Buz Devi)", info: "Yan yatmış bir varil gibi kendi etrafında dönen soğuk bir gaz devidir." },
            neptun: { name: "🌀 Neptün", info: "Şiddetli rüzgarların estiği masmavi gezegendir." }
        };

        let radioMessages = [
            "📡 MERKEZ: Kaptan, radarımızda yeni düşman sinyalleri var!",
            "📡 MERKEZ: Akçe kasalarını toplamayı unutma pilot!",
            "📡 TELSİZ: Ay üssünden bildiriyoruz, yerçekimi düşük dikkat et.",
            "📡 MERKEZ: Dükkandaki özel güçler savaşta hayat kurtarır!"
        ];
        let currentRadioText = "📡 Telsiz açık. Haberler bekleniyor...";

        const startBtn = { x: canvas.width / 2 - 130, y: canvas.height / 2 + 60, width: 260, height: 70 };
        const warriorsBtn = { x: canvas.width / 2 - 130, y: canvas.height / 2 + 145, width: 260, height: 65 };
        const spaceStationBtn = { x: 45, y: canvas.height / 2 - 165, width: 210, height: 55 };
        const otherModesBtn = { x: 45, y: canvas.height / 2 - 95, width: 210, height: 55 };
        const universeMapBtn = { x: 45, y: canvas.height / 2 - 25, width: 210, height: 55 };
        const titlesBtn = { x: 45, y: canvas.height / 2 + 45, width: 210, height: 55 };

        const celestialButtons = [
            { id: 'gunes', name: '⭐ Güneş', x: 260, y: 220, width: 220, height: 55 },
            { id: 'merkur', name: '🪐 Merkür', x: 500, y: 220, width: 220, height: 55 },
            { id: 'venus', name: '🪐 Venüs', x: 740, y: 220, width: 220, height: 55 },
            { id: 'dunya', name: '🌍 Dünya', x: 980, y: 220, width: 220, height: 55 },
            { id: 'ay', name: '🌕 Ay', x: 1220, y: 220, width: 120, height: 55 },
            { id: 'mars', name: '🔴 Mars', x: 260, y: 295, width: 220, height: 55 },
            { id: 'jupiter', name: '⚡ Jüpiter', x: 500, y: 295, width: 220, height: 55 },
            { id: 'saturn', name: '💫 Satürn', x: 740, y: 295, width: 220, height: 55 },
            { id: 'uranus', name: '❄️ Uranüs', x: 980, y: 295, width: 220, height: 55 },
            { id: 'neptun', name: '🌀 Neptün', x: 1220, y: 295, width: 120, height: 55 }
        ];

        const radioBtn = { x: canvas.width / 2 - 120, y: canvas.height / 2 + 200, width: 240, height: 50 };
        const closeSpaceStationBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 265, width: 180, height: 48 };
        const closeInfoCardBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 315, width: 180, height: 45 };

        const trainingModeBtn = { x: canvas.width / 2 - 170, y: canvas.height / 2 - 50, width: 340, height: 65 };
        const botVsModeBtn = { x: canvas.width / 2 - 210, y: canvas.height / 2 + 30, width: 420, height: 65 };
        const exitTrainingBtn = { x: canvas.width - 180, y: 25, width: 145, height: 45 };

        const botHamzaBtn = { x: canvas.width / 2 - 420, y: canvas.height / 2 - 60, width: 240, height: 75 };
        const botAlienBtn = { x: canvas.width / 2 - 120, y: canvas.height / 2 - 60, width: 240, height: 75 };
        const botDogBtn = { x: canvas.width / 2 + 180, y: canvas.height / 2 - 60, width: 240, height: 75 };

        const diffKolayBtn = { x: canvas.width / 2 - 360, y: canvas.height / 2 - 30, width: 220, height: 70 };
        const diffOrtaBtn = { x: canvas.width / 2 - 110, y: canvas.height / 2 - 30, width: 220, height: 70 };
        const diffZorBtn = { x: canvas.width / 2 + 140, y: canvas.height / 2 - 30, width: 220, height: 70 };

        const profileBtn = { x: 45, y: 45, width: 160, height: 50 };
        const shopBtn = { x: 45, y: canvas.height - 90, width: 160, height: 50 };
        const helpBtn = { x: canvas.width - 205, y: canvas.height - 90, width: 160, height: 50 };
        const newsBox = { x: canvas.width - 320, y: 40, width: 275, height: 215 };
        const questsBtn = { x: canvas.width - 320, y: 270, width: 275, height: 50 };

        const page1GridBtns = [];
        const btnW = 115, btnH = 65;
        const startXPos = canvas.width / 2 - (5 * btnW + 4 * 15) / 2;
        const startYPos = canvas.height / 2 - 120;
        for (let i = 0; i < 10; i++) {
            page1GridBtns.push({ x: startXPos + (i % 5) * (btnW + 15), y: startYPos + Math.floor(i / 5) * (btnH + 20), width: btnW, height: btnH });
        }

        const page2GridBtns = [];
        const p2BtnW = 110, p2BtnH = 60;
        const p2StartX = canvas.width / 2 - (10 * p2BtnW + 9 * 10) / 2;
        for (let i = 0; i < 20; i++) {
            page2GridBtns.push({ x: p2StartX + (i % 10) * (p2BtnW + 10), y: canvas.height / 2 - 110 + Math.floor(i / 10) * (p2BtnH + 30), width: p2BtnW, height: p2BtnH });
        }

        const prevPageBtn = { x: canvas.width / 2 - 250, y: canvas.height / 2 + 150, width: 70, height: 50 };
        const nextPageBtn = { x: canvas.width / 2 + 180, y: canvas.height / 2 + 150, width: 70, height: 50 };
        const backToMenuBtn = { x: canvas.width / 2 - 110, y: canvas.height / 2 + 210, width: 220, height: 50 };

        const closeUniverseMapBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 250, width: 180, height: 50 };
        const closeTitlesBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 250, width: 180, height: 50 };

        const catEfektBtn = { x: 400, y: 175, width: 260, height: 50 };
        const catOzelGucBtn = { x: 700, y: 175, width: 260, height: 50 };
        const catSavasciBtn = { x: 1000, y: 175, width: 260, height: 50 };

        const buyDoubleShotBtn = { x: canvas.width / 2 + 110, y: 300, width: 210, height: 45 };
        const buyPoisonBulletBtn = { x: canvas.width / 2 + 110, y: 440, width: 210, height: 45 };
        const buyBordoEffectBtn = { x: canvas.width / 2 + 110, y: 335, width: 210, height: 45 };
        const buyOrangeEffectBtn = { x: canvas.width / 2 + 110, y: 450, width: 210, height: 45 };
        const buyAlienBtn = { x: canvas.width / 2 + 110, y: 320, width: 210, height: 45 };
        const buyDogBtn = { x: canvas.width / 2 + 110, y: 460, width: 210, height: 45 };

        const selectHamzaBtn = { x: 300, y: 500, width: 140, height: 42 };
        const selectAlienBtn = { x: 675, y: 500, width: 140, height: 42 };
        const selectDogBtn = { x: 1050, y: 500, width: 140, height: 42 };

        const closeShopBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 250, width: 180, height: 50 };
        const closeWarriorsBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 260, width: 180, height: 50 };
        const closeHelpBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 230, width: 180, height: 45 };
        const closeProfileBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 260, width: 180, height: 50 };
        const closeNewsBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 280, width: 180, height: 50 };
        const closeQuestsBtn = { x: canvas.width / 2 - 90, y: canvas.height / 2 + 270, width: 180, height: 50 };

        const nextLevelBtn = { x: canvas.width / 2 - 135, y: canvas.height / 2 - 30, width: 270, height: 55 };
        const restartBtn = { x: canvas.width / 2 - 135, y: canvas.height / 2 + 35, width: 270, height: 55 };
        const menuBtn = { x: canvas.width / 2 - 135, y: canvas.height / 2 + 100, width: 270, height: 55 };

        function isHovered(btn) { return mouseX >= btn.x && mouseX <= btn.x + btn.width && mouseY >= btn.y && mouseY <= btn.y + btn.height; }
        function isTouched(btn, tx, ty) { return tx >= btn.x && tx <= btn.x + btn.width && ty >= btn.y && ty <= btn.y + btn.height; }

        function handleNameSubmission() {
            let enteredName = hiddenInput.value.trim();
            if (enteredName === "") { nameErrorMsg = "Lütfen boş bırakma!"; return; }
            playerName = enteredName; nameErrorMsg = "";
            hiddenInput.style.display = 'none'; gameState = 'start'; saveGameData();
        }

        window.addEventListener("click", () => { if (gameState === 'name_entry') hiddenInput.focus(); });
        hiddenInput.addEventListener("input", () => { if (gameState === 'name_entry') playerName = hiddenInput.value; });
        hiddenInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && gameState === 'name_entry') handleNameSubmission(); });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            touchLeftActive = false; touchRightActive = false;
            for (let i = 0; i < e.touches.length; i++) {
                let tx = (e.touches[i].clientX - rect.left) * scaleX, ty = (e.touches[i].clientY - rect.top) * scaleY;
                mouseX = tx; mouseY = ty;
                if (gameState === 'playing') {
                    if (isTouched(touchLeftBtn, tx, ty)) touchLeftActive = true;
                    if (isTouched(touchRightBtn, tx, ty)) touchRightActive = true;
                    if (isTouched(touchShootBtn, tx, ty)) shoot();
                }
            }
            if (gameState === 'name_entry') hiddenInput.focus();
            handleCanvasClickOrTouch();
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            touchLeftActive = false; touchRightActive = false;
            for (let i = 0; i < e.touches.length; i++) {
                let tx = (e.touches[i].clientX - rect.left) * scaleX, ty = (e.touches[i].clientY - rect.top) * scaleY;
                if (gameState === 'playing') {
                    if (isTouched(touchLeftBtn, tx, ty)) touchLeftActive = true;
                    if (isTouched(touchRightBtn, tx, ty)) touchRightActive = true;
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", () => { touchLeftActive = false; touchRightActive = false; }, { passive: false });

        window.addEventListener("keydown", (e) => {
            if (gameState === 'name_entry') return;
            if (isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) {
                if (e.code === "Escape") {
                    if (selectedCelestialBody) selectedCelestialBody = null;
                    else { isShopOpen = isWarriorsOpen = isHelpOpen = isProfileOpen = isNewsOpen = isQuestsOpen = isUniverseMapOpen = isTitlesOpen = isSpaceStationOpen = false; }
                }
                return;
            }
            if (gameState === 'start' || gameState === 'level_select' || gameState === 'other_modes') {
                if (e.code === "Escape") {
                    if (gameState === 'other_modes' && isBotVsMode) { isBotVsMode = false; botVsState = 'select_char'; }
                    else gameState = 'start';
                }
                return;
            }
            if (gameState === 'win') {
                if (e.code === "KeyS" || e.code === "KeyN") { if (!isBotVsMode && currentLevel < 30) startPlaying(currentLevel + 1); }
                else if (e.code === "KeyR" || e.code === "Enter") { if (isBotVsMode) startBotVsBattle(); else startPlaying(currentLevel); }
                else if (e.code === "KeyM") goToMainMenu();
                return;
            }
            if (gameState === 'gameover') {
                if (e.code === "KeyR" || e.code === "Enter") { if (isBotVsMode) startBotVsBattle(); else startPlaying(currentLevel); }
                else if (e.code === "KeyM") goToMainMenu();
                return;
            }
            if (gameState === 'playing' && e.code === "KeyQ") {
                if (hasPoisonBullet && isPoisonBulletEquipped && poisonAmmoCount > 0 && !isPoisonActive) {
                    isPoisonActive = true; poisonAmmoCount--; poisonTimer = 240;
                }
            }
            if (e.code === "Space" && !keys["Space"]) shoot();
            keys[e.code] = true;
        });

        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function handleCanvasClickOrTouch() {
            if (gameState === 'name_entry') { if (isHovered(nameSubmitBtn)) handleNameSubmission(); return; }
            if (selectedCelestialBody) { if (isHovered(closeInfoCardBtn)) selectedCelestialBody = null; return; }
            if (isSpaceStationOpen) {
                if (isHovered(closeSpaceStationBtn)) isSpaceStationOpen = false;
                else if (isHovered(radioBtn)) { currentRadioText = radioMessages[Math.floor(Math.random() * radioMessages.length)]; }
                else { for (let i = 0; i < celestialButtons.length; i++) { if (isHovered(celestialButtons[i])) { selectedCelestialBody = celestialData[celestialButtons[i].id]; break; } } }
                return;
            }
            if (isTitlesOpen) { if (isHovered(closeTitlesBtn)) isTitlesOpen = false; return; }
            if (isUniverseMapOpen) { if (isHovered(closeUniverseMapBtn)) isUniverseMapOpen = false; return; }
            if (gameState === 'playing' && (isTrainingMode || isBotVsMode) && isHovered(exitTrainingBtn)) { goToMainMenu(); return; }
            if (isNewsOpen) { if (isHovered(closeNewsBtn)) isNewsOpen = false; return; }
            if (isQuestsOpen) { if (isHovered(closeQuestsBtn)) isQuestsOpen = false; return; }
            if (isShopOpen) {
                if (isHovered(catEfektBtn)) shopCategory = 'efekt';
                if (isHovered(catOzelGucBtn)) shopCategory = 'ozel_guc';
                if (isHovered(catSavasciBtn)) shopCategory = 'savasci';
                if (shopCategory === 'savasci') {
                    if (isHovered(buyAlienBtn) && !hasAlienWarrior && totalCoins >= 15000) { totalCoins -= 15000; hasAlienWarrior = true; selectedWarrior = 'alien'; saveGameData(); }
                    if (isHovered(buyDogBtn) && !hasDogWarrior && totalCoins >= 14000) { totalCoins -= 14000; hasDogWarrior = true; selectedWarrior = 'dog'; saveGameData(); }
                }
                if (shopCategory === 'ozel_guc') {
                    if (isHovered(buyDoubleShotBtn)) {
                        if (!hasDoubleShot && totalCoins >= 1000) { totalCoins -= 1000; hasDoubleShot = true; isDoubleShotEquipped = true; saveGameData(); }
                        else if (hasDoubleShot) { isDoubleShotEquipped = !isDoubleShotEquipped; saveGameData(); }
                    }
                    if (isHovered(buyPoisonBulletBtn)) {
                        if (!hasPoisonBullet && totalCoins >= 1200) { totalCoins -= 1200; hasPoisonBullet = true; isPoisonBulletEquipped = true; saveGameData(); }
                        else if (hasPoisonBullet) { isPoisonBulletEquipped = !isPoisonBulletEquipped; saveGameData(); }
                    }
                }
                if (shopCategory === 'efekt') {
                    if (isHovered(buyBordoEffectBtn)) {
                        if (!hasBordoEffect && totalCoins >= 550) { totalCoins -= 550; hasBordoEffect = true; isBordoEffectEquipped = true; isOrangeEffectEquipped = false; saveGameData(); }
                        else if (hasBordoEffect) { isBordoEffectEquipped = !isBordoEffectEquipped; if(isBordoEffectEquipped) isOrangeEffectEquipped = false; saveGameData(); }
                    }
                    if (isHovered(buyOrangeEffectBtn)) {
                        if (!hasOrangeEffect && totalCoins >= 250) { totalCoins -= 250; hasOrangeEffect = true; isOrangeEffectEquipped = true; isBordoEffectEquipped = false; saveGameData(); }
                        else if (hasOrangeEffect) { isOrangeEffectEquipped = !isOrangeEffectEquipped; if(isOrangeEffectEquipped) isBordoEffectEquipped = false; saveGameData(); }
                    }
                }
                if (isHovered(closeShopBtn)) isShopOpen = false;
                return;
            }
            if (isWarriorsOpen) {
                if (isHovered(selectHamzaBtn)) { selectedWarrior = 'hamza'; saveGameData(); }
                if (isHovered(selectAlienBtn) && hasAlienWarrior) { selectedWarrior = 'alien'; saveGameData(); }
                if (isHovered(selectDogBtn) && hasDogWarrior) { selectedWarrior = 'dog'; saveGameData(); }
                if (isHovered(closeWarriorsBtn)) isWarriorsOpen = false;
                return;
            }
            if (isHelpOpen) { if (isHovered(closeHelpBtn)) isHelpOpen = false; return; }
            if (isProfileOpen) { if (isHovered(closeProfileBtn)) isProfileOpen = false; return; }

            if (gameState === 'start') {
                if (isHovered(spaceStationBtn)) { isSpaceStationOpen = true; return; }
                if (isHovered(newsBox)) { isNewsOpen = true; return; }
                if (isHovered(questsBtn)) { isQuestsOpen = true; return; }
                if (isHovered(shopBtn)) { isShopOpen = true; return; }
                if (isHovered(profileBtn)) { isProfileOpen = true; return; }
                if (isHovered(warriorsBtn)) { isWarriorsOpen = true; return; }
                if (isHovered(helpBtn)) { isHelpOpen = true; return; }
                if (isHovered(otherModesBtn)) { gameState = 'other_modes'; return; }
                if (isHovered(universeMapBtn)) { isUniverseMapOpen = true; return; }
                if (isHovered(titlesBtn)) { isTitlesOpen = true; return; }
                if (isHovered(startBtn)) { gameState = 'level_select'; levelPage = 1; }
            } else if (gameState === 'other_modes') {
                if (!isBotVsMode) {
                    if (isHovered(trainingModeBtn)) { isTrainingMode = true; startPlaying(1); }
                    if (isHovered(botVsModeBtn)) { isBotVsMode = true; botVsState = 'select_char'; }
                } else {
                    if (botVsState === 'select_char') {
                        if (isHovered(botHamzaBtn)) { selectedBotCharacter = 'hamza'; botVsState = 'select_diff'; }
                        if (isHovered(botAlienBtn)) { selectedBotCharacter = 'alien'; botVsState = 'select_diff'; }
                        if (isHovered(botDogBtn)) { selectedBotCharacter = 'dog'; botVsState = 'select_diff'; }
                    } else if (botVsState === 'select_diff') {
                        if (isHovered(diffKolayBtn)) { botDifficulty = 'kolay'; startBotVsBattle(); }
                        if (isHovered(diffOrtaBtn)) { botDifficulty = 'orta'; startBotVsBattle(); }
                        if (isHovered(diffZorBtn)) { botDifficulty = 'zor'; startBotVsBattle(); }
                    }
                }
                if (isHovered(backToMenuBtn)) {
                    if (isBotVsMode && botVsState === 'select_diff') botVsState = 'select_char';
                    else { isBotVsMode = false; gameState = 'start'; }
                }
            } else if (gameState === 'level_select') {
                isTrainingMode = false; isBotVsMode = false;
                if (isHovered(nextPageBtn) && levelPage === 1) { levelPage = 2; return; }
                if (isHovered(prevPageBtn) && levelPage === 2) { levelPage = 1; return; }
                if (levelPage === 1) {
                    for (let i = 0; i < page1GridBtns.length; i++) {
                        if (isHovered(page1GridBtns[i])) { let lvl = i + 1; if (lvl <= unlockedLevel) startPlaying(lvl); else alert("⚠️ Kilitli!"); }
                    }
                } else if (levelPage === 2) {
                    for (let i = 0; i < page2GridBtns.length; i++) {
                        if (isHovered(page2GridBtns[i])) { let lvl = 11 + i; if (lvl <= unlockedLevel && completedUniqueLevels.includes(10)) startPlaying(lvl); else alert("⚠️ 10. Seviyeyi bitirmelisin!"); }
                    }
                }
                if (isHovered(backToMenuBtn)) gameState = 'start';
            } else if (gameState === 'win') {
                if (!isBotVsMode && isHovered(nextLevelBtn) && currentLevel < 30) startPlaying(currentLevel + 1);
                if (isHovered(restartBtn)) { if (isBotVsMode) startBotVsBattle(); else startPlaying(currentLevel); }
                if (isHovered(menuBtn)) goToMainMenu();
            } else if (gameState === 'gameover') {
                if (isHovered(restartBtn)) { if (isBotVsMode) startBotVsBattle(); else startPlaying(currentLevel); }
                if (isHovered(menuBtn)) goToMainMenu();
            }
        }

        canvas.addEventListener("click", () => { handleCanvasClickOrTouch(); });

        function shoot() {
            let col = isBordoEffectEquipped ? "#800020" : isOrangeEffectEquipped ? "#ff7b00" : "#00f0ff";
            let isP = false;
            if (isPoisonBulletEquipped && isPoisonActive) { col = "#00ff66"; isP = true; isPoisonActive = false; }
            if (isDoubleShotEquipped) {
                bullets.push({ x: player.x + 20, y: player.y + 20, width: 6, height: 18, color: col, isPoison: isP });
                bullets.push({ x: player.x + player.width - 26, y: player.y + 20, width: 6, height: 18, color: col, isPoison: isP });
                stats.totalBulletsFired += 2;
            } else {
                bullets.push({ x: player.x + player.width / 2 - 3, y: player.y + 20, width: 6, height: 18, color: col, isPoison: isP });
                stats.totalBulletsFired += 1;
            }
            saveGameData();
        }

        function startBotVsBattle() {
            isBotVsMode = true; gameState = 'playing';
            player.x = canvas.width / 2 - playerWidth / 2; player.y = canvas.height - playerHeight - 25;
            player.maxHp = selectedWarrior === 'dog' ? 85 : selectedWarrior === 'alien' ? 105 : 100;
            player.hp = player.maxHp; player.speed = selectedWarrior === 'dog' ? 12 : 9;
            bullets = []; enemyBullets = []; apples = []; initEnemies(1);
        }

        function startPlaying(level) {
            currentLevel = level; isBotVsMode = false;
            player.x = canvas.width / 2 - playerWidth / 2; player.y = canvas.height - playerHeight - 25;
            player.maxHp = selectedWarrior === 'dog' ? 85 : selectedWarrior === 'alien' ? 105 : 100;
            player.hp = player.maxHp; player.speed = selectedWarrior === 'dog' ? 12 : 9;
            bullets = []; enemyBullets = []; apples = []; lastAppleTime = Date.now();
            isBossSpawned = false; initEnemies(currentLevel);
            gameState = 'playing';
        }

        function goToMainMenu() {
            player.hp = player.maxHp; bullets = []; enemyBullets = []; apples = [];
            isTrainingMode = false; isBotVsMode = false; botVsState = 'select_char'; gameState = 'start';
        }

        function initEnemies(level) {
            enemies = [];
            if (isBotVsMode) {
                let hp = selectedBotCharacter === 'alien' ? 105 : selectedBotCharacter === 'dog' ? 85 : 100;
                let spd = botDifficulty === 'kolay' ? 3.5 : botDifficulty === 'orta' ? 5.5 : 7.5;
                let inter = botDifficulty === 'kolay' ? 420 : botDifficulty === 'orta' ? 280 : 150;
                enemies = [{ x: canvas.width / 2 - 45, y: 110, width: 90, height: 110, hp: hp, maxHp: hp, dx: spd, speed: spd, shootTimer: 0, shootInterval: inter, bulletColor: "#ff3333", bulletSpeed: 3.5, color: "#e63946", isBotEnemy: true, botCharType: selectedBotCharacter, aiDecisionTimer: 0, targetX: canvas.width / 2 - 45 }];
                return;
            }
            if (isTrainingMode) {
                enemies = [
                    { x: 150, y: 100, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: 1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" },
                    { x: 500, y: 150, width: 85, height: 60, hp: 1000, maxHp: 1000, dx: -1.8, shootTimer: 0, shootInterval: 99999, bulletColor: "#000", bulletSpeed: 0, color: "#7209b7" }
                ];
                return;
            }
            if (level === 1) enemies = [{ x: 400, y: 110, width: 80, height: 55, hp: 15, maxHp: 15, dx: 1.2, shootTimer: 0, shootInterval: 350, bulletColor: "#ff3333", bulletSpeed: 1.8, color: "#e63946" }];
            else enemies = [{ x: 400, y: 110, width: 80, height: 55, hp: 20 + level * 3, maxHp: 20 + level * 3, dx: 1.5, shootTimer: 0, shootInterval: 300, bulletColor: "#00f0ff", bulletSpeed: 2.0, color: "#0077b6" }];
        }

        function update() {
            if (gameState !== 'playing' || isShopOpen || isWarriorsOpen || isHelpOpen || isProfileOpen || isNewsOpen || isQuestsOpen || isUniverseMapOpen || isTitlesOpen || isSpaceStationOpen || selectedCelestialBody) return;

            if (poisonTimer > 0) {
                poisonTimer--; poisonTickTimer++;
                if (poisonTickTimer >= 60 && enemies.length > 0) {
                    enemies[0].hp -= 2;
                    if (enemies[0].hp <= 0) { stats.totalEnemiesKilled++; enemies.splice(0, 1); }
                    poisonTickTimer = 0;
                }
            }

            if ((keys["ArrowLeft"] || touchLeftActive) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || touchRightActive) && player.x < canvas.width - player.width) player.x += player.speed;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (bullets[i] && bullets[i].x < en.x + en.width && bullets[i].x + bullets[i].width > en.x && bullets[i].y < en.y + en.height && bullets[i].y + bullets[i].height > en.y) {
                        en.hp -= 1; if (bullets[i].isPoison) { poisonTimer = 240; poisonTickTimer = 0; }
                        hit = true;
                        if (en.hp <= 0) { stats.totalEnemiesKilled++; enemies.splice(j, 1); }
                        break;
                    }
                }
                if (hit || (bullets[i] && bullets[i].y < -20)) bullets.splice(i, 1);
            }

            if (enemies.length === 0) {
                if (!isTrainingMode) {
                    totalCoins += currentLevel * 10;
                    totalWins++;
                    if (!isBotVsMode) {
                        if (currentLevel === 5) titles.find(t => t.id === 'boss_slayer').unlocked = true;
                        if (currentLevel === 10) titles.find(t => t.id === 'ay_dede').unlocked = true;
                        if (!completedUniqueLevels.includes(currentLevel)) completedUniqueLevels.push(currentLevel);
                        if (currentLevel === unlockedLevel) unlockedLevel++;
                    }
                    saveGameData();
                }
                gameState = 'win';
                return;
            }

            enemies.forEach(en => {
                if (en.isBotEnemy) {
                    en.aiDecisionTimer++;
                    if (en.aiDecisionTimer > 60) { en.targetX = Math.max(50, Math.min(canvas.width - en.width - 50, player.x + (Math.random() * 200 - 100))); en.aiDecisionTimer = 0; }
                    if (en.x < en.targetX) en.x = Math.min(en.targetX, en.x + en.speed);
                    else if (en.x > en.targetX) en.x = Math.max(en.targetX, en.x - en.speed);
                } else {
                    en.x += en.dx;
                    if (en.x <= 20 || en.x + en.width >= canvas.width - 20) en.dx *= -1;
                }
            });
        }

        function drawButton(btn, bg, hoverBg, txtCol, txt, fontSize = "18px", locked = false) {
            let hov = isHovered(btn) && !locked;
            ctx.fillStyle = locked ? "#334155" : (hov ? hoverBg : bg);
            ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
            ctx.strokeStyle = locked ? "#64748b" : "#ffffff";
            ctx.lineWidth = hov ? 3 : 2;
            ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);
            ctx.fillStyle = locked ? "#94a3b8" : txtCol;
            ctx.font = `bold ${fontSize} Arial`;
            ctx.fillText(txt, btn.x + 12, btn.y + (btn.height / 2) + 6);
        }

        function draw() {
            if (gameState === 'name_entry') {
                ctx.fillStyle = "#07071a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00d2ff"; ctx.font = "bold 60px Arial";
                ctx.fillText("🚀 UZAY MACERASI", canvas.width / 2 - 270, canvas.height / 2 - 180);
                ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px Arial";
                ctx.fillText("KAPTAN İSMİNİ GİR (Telefonda dokunman yeterli):", canvas.width / 2 - 275, canvas.height / 2 - 100);
                ctx.fillStyle = "#1e293b"; ctx.fillRect(nameInputRect.x, nameInputRect.y, nameInputRect.width, nameInputRect.height);
                ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 3; ctx.strokeRect(nameInputRect.x, nameInputRect.y, nameInputRect.width, nameInputRect.height);
                ctx.fillStyle = "#ffd700"; ctx.font = "bold 28px Arial";
                ctx.fillText(playerName + (Math.floor(Date.now() / 500) % 2 === 0 ? "|" : ""), nameInputRect.x + 20, nameInputRect.y + 40);
                if (nameErrorMsg !== "") {
                    ctx.fillStyle = "#ff3366"; ctx.font = "bold 18px Arial";
                    ctx.fillText(nameErrorMsg, canvas.width / 2 - 200, canvas.height / 2 + 35);
                }
                drawButton(nameSubmitBtn, "#00ff66", "#34d399", "#000000", "MACERAYA BAŞLA", "22px");
                return;
            }

            ctx.fillStyle = "#07071a"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'start') {
                drawButton(profileBtn, "#10b981", "#34d399", "#ffffff", "👤 LİDERLİK", "19px");
                drawButton(shopBtn, "#00d2ff", "#38bdf8", "#000000", "🛒 DÜKKAN", "19px");
                drawButton({ x: shopBtn.x + shopBtn.width + 15, y: shopBtn.y, width: 200, height: 50 }, "#ffd700", "#fde047", "#000000", "🪙 AKÇE: " + totalCoins, "18px");
                drawButton(helpBtn, "#a855f7", "#c084fc", "#ffffff", "❓ YARDIM", "19px");
                drawButton(spaceStationBtn, "#00ff66", "#34d399", "#000000", "🚀 UZAY İSTASYONU", "15px");
                drawButton(otherModesBtn, "#7209b7", "#9d4edd", "#ffffff", "🌀 DİĞER MODLAR", "17px");
                drawButton(universeMapBtn, "#3a86ff", "#4ea8de", "#ffffff", "🌌 GİDİLEN YERLER", "16px");
                drawButton(titlesBtn, "#f72585", "#ff4d6d", "#ffffff", "🎖️ ÜNVANLAR", "18px");

                ctx.fillStyle = "rgba(10, 15, 35, 0.85)"; ctx.fillRect(newsBox.x, newsBox.y, newsBox.width, newsBox.height);
                ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(newsBox.x, newsBox.y, newsBox.width, newsBox.height);
                ctx.fillStyle = "#00d2ff"; ctx.font = "bold 17px Arial"; ctx.fillText("📰 UZAY HABERLERİ", newsBox.x + 35, newsBox.y + 35);
                ctx.fillStyle = "#ffffff"; ctx.font = "14px Arial"; ctx.fillText("Kaptan, galaksi seni bekliyor!", newsBox.x + 15, newsBox.y + 80);

                drawButton(questsBtn, "#e056fd", "#f368e0", "#ffffff", "🎯 GÖREVLER", "18px");

                ctx.fillStyle = "#00d2ff"; ctx.font = "bold 60px Arial";
                ctx.fillText("KAPTAN " + playerName.toUpperCase(), canvas.width / 2 - 280, 230);
                drawButton(warriorsBtn, "#ffaa00", "#fbbf24", "#000000", "🛡️ SAVAŞÇILAR", "22px");
                drawButton(startBtn, "#ff3366", "#fb7185", "#ffffff", "OYUNA BAŞLA", "24px");

                if (isProfileOpen) {
                    ctx.fillStyle = "rgba(0, 20, 15, 0.98)"; ctx.fillRect(150, 70, canvas.width - 300, canvas.height - 140);
                    ctx.strokeStyle = "#10b981"; ctx.lineWidth = 4; ctx.strokeRect(150, 70, canvas.width - 300, canvas.height - 140);
                    ctx.fillStyle = "#10b981"; ctx.font = "bold 30px Arial";
                    ctx.fillText("👤 OYUNCU PROFİLİ & İSTATİSTİKLER", canvas.width / 2 - 280, 130);

                    ctx.fillStyle = "#ffffff"; ctx.font = "22px Arial";
                    ctx.fillText("Kaptan Adı: " + playerName, 220, 210);
                    ctx.fillText("Toplam Kazanılan Zafer: " + totalWins, 220, 260);
                    ctx.fillText("Vurulan Düşman: " + stats.totalEnemiesKilled, 220, 310);
                    ctx.fillText("Atılan Mermi: " + stats.totalBulletsFired, 220, 360);

                    drawButton(closeProfileBtn, "#ff3366", "#fb7185", "#ffffff", "KAPAT", "20px");
                }
                return;
            }

            if (gameState === 'level_select') {
                ctx.fillStyle = "#00d2ff"; ctx.font = "bold 45px Arial";
                ctx.fillText("🌌 BÖLÜM SEÇİMİ (Sayfa " + levelPage + "/2)", canvas.width / 2 - 240, 110);
                
                let currentGrid = levelPage === 1 ? page1GridBtns : page2GridBtns;
                for (let i = 0; i < currentGrid.length; i++) {
                    let lvl = levelPage === 1 ? i + 1 : 11 + i;
                    let locked = lvl > unlockedLevel;
                    drawButton(currentGrid[i], "#1e293b", "#334155", "#ffffff", "Seviye " + lvl, "18px", locked);
                }
                if (levelPage === 1) drawButton(nextPageBtn, "#00ff66", "#34d399", "#000000", "İLERİ ➡️", "18px");
                if (levelPage === 2) drawButton(prevPageBtn, "#00ff66", "#34d399", "#000000", "⬅️ GERİ", "18px");
                drawButton(backToMenuBtn, "#ff3366", "#fb7185", "#ffffff", "ANA EKRAN", "18px");
                return;
            }

            if (gameState === 'other_modes') {
                if (!isBotVsMode) {
                    ctx.fillStyle = "#00ff66"; ctx.font = "bold 45px Arial"; ctx.fillText("🌀 DİĞER OYUN MODLARI", canvas.width / 2 - 230, 140);
                    drawButton(trainingModeBtn, "#7209b7", "#9d4edd", "#ffffff", "🎯 EĞİTİM MODU (Ateş Et)", "20px");
                    drawButton(botVsModeBtn, "#3a86ff", "#4ea8de", "#ffffff", "🤖 BOTA KARŞI SAVAŞ (PvP)", "20px");
                } else {
                    if (botVsState === 'select_char') {
                        ctx.fillStyle = "#ffd700"; ctx.font = "bold 40px Arial"; ctx.fillText("🛡️ SAVAŞÇINI SEÇ", canvas.width / 2 - 160, 180);
                        drawButton(botHamzaBtn, "#ff3366", "#fb7185", "#ffffff", "Kaptan Hamza", "22px");
                        drawButton(botAlienBtn, "#2dc653", "#38b000", "#ffffff", "Uzaylı Savaşçı", "22px");
                        drawButton(botDogBtn, "#ffaa00", "#fbbf24", "#000000", "Süper Köpek", "22px");
                    } else if (botVsState === 'select_diff') {
                        ctx.fillStyle = "#ffd700"; ctx.font = "bold 40px Arial"; ctx.fillText("⚡ ZORLUK SEVİYESİ SEÇ", canvas.width / 2 - 210, 180);
                        drawButton(diffKolayBtn, "#2dc653", "#38b000", "#ffffff", "KOLAY", "22px");
                        drawButton(diffOrtaBtn, "#ffaa00", "#fbbf24", "#000000", "ORTA", "22px");
                        drawButton(diffZorBtn, "#ff3366", "#fb7185", "#ffffff", "ZOR", "22px");
                    }
                }
                drawButton(backToMenuBtn, "#ff3366", "#fb7185", "#ffffff", "ANA EKRAN", "18px");
                return;
            }

            // OYUN İÇİ
            enemies.forEach(en => { ctx.fillStyle = en.color || "#e63946"; ctx.fillRect(en.x, en.y, en.width, en.height); });
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.width, b.height); });
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

            if (gameState === 'playing') {
                ctx.fillStyle = touchLeftActive ? "rgba(0, 210, 255, 0.7)" : "rgba(0, 210, 255, 0.3)";
                ctx.fillRect(touchLeftBtn.x, touchLeftBtn.y, touchLeftBtn.width, touchLeftBtn.height);
                ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(touchLeftBtn.x, touchLeftBtn.y, touchLeftBtn.width, touchLeftBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 45px Arial"; ctx.fillText("⬅️", touchLeftBtn.x + 22, touchLeftBtn.y + 82);

                ctx.fillStyle = touchRightActive ? "rgba(0, 210, 255, 0.7)" : "rgba(0, 210, 255, 0.3)";
                ctx.fillRect(touchRightBtn.x, touchRightBtn.y, touchRightBtn.width, touchRightBtn.height);
                ctx.strokeStyle = "#00d2ff"; ctx.strokeRect(touchRightBtn.x, touchRightBtn.y, touchRightBtn.width, touchRightBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 45px Arial"; ctx.fillText("➡️", touchRightBtn.x + 22, touchRightBtn.y + 82);

                ctx.fillStyle = "rgba(255, 51, 102, 0.4)";
                ctx.fillRect(touchShootBtn.x, touchShootBtn.y, touchShootBtn.width, touchShootBtn.height);
                ctx.strokeStyle = "#ff3366"; ctx.strokeRect(touchShootBtn.x, touchShootBtn.y, touchShootBtn.width, touchShootBtn.height);
                ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial"; ctx.fillText("🔥 ATEŞ", touchShootBtn.x + 22, touchShootBtn.y + 72);

                if (isTrainingMode || isBotVsMode) {
                    drawButton(exitTrainingBtn, "#ff3366", "#fb7185", "#ffffff", "ÇIKIŞ (ESC)", "16px");
                }
            }

            if (gameState === 'win') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85);"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ff66"; ctx.font = "bold 58px Arial"; ctx.fillText("SEVİYE TAMAMLANDI!", canvas.width / 2 - 280, canvas.height / 2 - 80);
                if (!isBotVsMode && currentLevel < 30) drawButton(nextLevelBtn, "#00ff66", "#34d399", "#000000", "SONRAKİ SEVİYE (S)", "20px");
                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "TEKRAR OYNA (R)", "20px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN (M)", "20px");
            }

            if (gameState === 'gameover') {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85);"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3366"; ctx.font = "bold 64px Arial"; ctx.fillText("GAME OVER", canvas.width / 2 - 195, canvas.height / 2 - 80);
                drawButton(restartBtn, "#00d2ff", "#38bdf8", "#000000", "TEKRAR DENE", "22px");
                drawButton(menuBtn, "#ffaa00", "#fbbf24", "#000000", "ANA EKRAN", "21px");
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
